# Render Blueprint untuk backend EventKu (Node.js + Express + Neon PostgreSQL)
# Variabel bertanda sync: false diisi langsung di Dashboard Render (jangan simpan rahasia di Git).
services:
  - type: web
    name: eventku-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "28800"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UKWMS_EMAIL_DOMAINS
        value: student.ukwms.ac.id
