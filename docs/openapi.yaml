openapi: 3.0.3
info:
  title: EventKu API
  version: 1.0.0
  description: |
    Dokumentasi REST API EventKu. Endpoint API memakai prefix `/api/v1`,
    kecuali health check. Endpoint yang memerlukan login menggunakan access
    token JWT pada header `Authorization: Bearer <token>`.
servers:
  - url: /api/v1
    description: Server aktif saat ini (otomatis mengikuti domain)
  - url: https://uas-projek-rpl-eventku.yuhugelo4.workers.dev/api/v1
    description: Server produksi live (Cloudflare Workers + Neon PostgreSQL)
  - url: http://localhost:3000/api/v1
    description: Server lokal (sesuaikan dengan EventKu_Local.postman_environment.json)
tags:
  - name: Health
  - name: Auth
  - name: Categories
  - name: Events
  - name: Registrations
  - name: Organizer
  - name: Notifications
  - name: Student
  - name: Assets
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Memeriksa status server
      servers:
        - url: /
          description: Root server aktif saat ini (otomatis mengikuti domain)
        - url: https://uas-projek-rpl-eventku.yuhugelo4.workers.dev
          description: Server produksi live (Cloudflare Workers)
        - url: http://localhost:3000
          description: Server lokal
      security: []
      responses:
        '200':
          description: Server aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /auth/register:
    post:
      tags: [Auth]
      summary: Mendaftarkan akun mahasiswa atau penyelenggara
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Akun berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  role: { type: string, enum: [mahasiswa, penyelenggara] }
                  status: { type: string, enum: [active, pending] }
                  organizationId: { type: string, format: uuid, nullable: true }
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /auth/login:
    post:
      tags: [Auth]
      summary: Login dan mendapatkan access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, user]
                properties:
                  accessToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout dan mencabut sesi token saat ini
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      summary: Mendapatkan profil akun saat ini
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me/profile:
    patch:
      tags: [Auth]
      summary: Mengubah nama dan foto profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                photoUrl: { type: string, description: URL foto HTTPS atau string kosong }
      responses:
        '200':
          description: Profil yang telah diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /auth/me/password:
    patch:
      tags: [Auth]
      summary: Mengubah kata sandi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, password]
              properties:
                currentPassword: { type: string, maxLength: 128 }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Meminta tautan pemulihan kata sandi
      description: Jawaban sama diberikan untuk email terdaftar maupun tidak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Mengatur ulang kata sandi dengan token pemulihan
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, pattern: '^[a-f0-9]{64}$' }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
  /categories:
    get:
      tags: [Categories]
      summary: Mendapatkan kategori aktif
      security: []
      responses:
        '200':
          description: Daftar kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
  /events:
    get:
      tags: [Events]
      summary: Mencari event yang disetujui
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string }
          description: Pencarian judul dan deskripsi
        - name: category
          in: query
          schema: { type: string, format: uuid }
        - name: organizer
          in: query
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Filter tanggal lokal WIB; tidak dapat dipakai bersama from/to
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Halaman event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '422':
          $ref: '#/components/responses/InvalidInput'
    post:
      tags: [Events]
      summary: Membuat draft event (penyelenggara terverifikasi)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Draft berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string, format: uuid }
                  status: { type: string, enum: [draft] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Events]
      summary: Mendapatkan detail event publik
      description: Event non-publik hanya dapat dilihat penyelenggara pemilik event.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: Detail event
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/Event' }
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{eventId}/submit:
    parameters:
      - $ref: '#/components/parameters/EventId'
    patch:
      tags: [Events]
      summary: Mengajukan draft event untuk moderasi
      description: Khusus penyelenggara pemilik event dengan organisasi terverifikasi.
      responses:
        '200':
          description: Event masuk antrean moderasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [menunggu_moderasi] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /events/{eventId}/registrations:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Registrations]
      summary: Mendaftar (RSVP) ke event
      description: Khusus mahasiswa UKWMS terverifikasi; kuota penuh menghasilkan 409.
      responses:
        '201':
          description: Pendaftaran berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /registrations/me:
    get:
      tags: [Registrations]
      summary: Mendapatkan daftar pendaftaran mahasiswa
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: scope
          in: query
          schema: { type: string, enum: [upcoming, history], default: upcoming }
      responses:
        '200':
          description: Halaman pendaftaran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /registrations/{registrationId}:
    delete:
      tags: [Registrations]
      summary: Membatalkan pendaftaran sendiri
      parameters:
        - name: registrationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizer/events:
    get:
      tags: [Organizer]
      summary: Mendaftar event milik organisasi penyelenggara
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Halaman event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizer/statistics:
    get:
      tags: [Organizer]
      summary: Statistik event dan pendaftaran organisasi
      responses:
        '200':
          description: Statistik penyelenggara
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: integer }
                  occupancy: { type: integer, description: Persentase keterisian }
                  trend:
                    type: array
                    items: { $ref: '#/components/schemas/CountLabel' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizer/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Organizer]
      summary: Mendapatkan detail event milik organisasi
      responses:
        '200':
          description: Detail event internal
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/InternalEvent' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Organizer]
      summary: Mengubah atau membatalkan event milik organisasi
      description: Perubahan memakai expectedStatus dan expectedVersion untuk mencegah penyuntingan versi usang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerEventChange'
      responses:
        '200':
          description: Event setelah perubahan
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: '#/components/schemas/InternalEvent' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /organizer/events/{eventId}/participants:
    get:
      tags: [Organizer]
      summary: Melihat atau mengekspor peserta event
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: format
          in: query
          description: Gunakan csv untuk memperoleh isi CSV dalam JSON.
          schema: { type: string, enum: [csv] }
      responses:
        '200':
          description: Daftar peserta, atau objek berisi csv bila format=csv
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ParticipantPage'
                  - type: object
                    properties:
                      csv: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/me:
    get:
      tags: [Notifications]
      summary: Mendapatkan notifikasi penyelenggara
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Halaman notifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/me/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Menandai notifikasi penyelenggara telah dibaca
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Status baca berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  notificationId: { type: string, format: uuid }
                  isRead: { type: boolean, enum: [true] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /student/notifications:
    get:
      tags: [Student]
      summary: Mendapatkan notifikasi mahasiswa
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PageOfObjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /student/notifications/{notificationId}/read:
    patch:
      tags: [Student]
      summary: Menandai notifikasi mahasiswa telah dibaca
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Status baca berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  isRead: { type: boolean, enum: [true] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /student/demo-mail:
    get:
      tags: [Student]
      summary: Melihat salinan email demo dari outbox
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PageOfObjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /student/notification-preferences:
    get:
      tags: [Student]
      summary: Mendapatkan preferensi email notifikasi
      responses:
        '200':
          description: Preferensi notifikasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailEnabled: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Student]
      summary: Mengubah preferensi email notifikasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emailEnabled]
              properties:
                emailEnabled: { type: boolean }
      responses:
        '200':
          description: Preferensi tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  emailEnabled: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /student/interests:
    get:
      tags: [Student]
      summary: Mendapatkan kategori minat mahasiswa
      responses:
        '200':
          description: Daftar ID kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryIds:
                    type: array
                    items: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Student]
      summary: Mengatur kategori minat mahasiswa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryIds]
              properties:
                categoryIds:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Kategori minat tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  categoryIds:
                    type: array
                    items: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /student/favorites:
    get:
      tags: [Student]
      summary: Mendapatkan event favorit mahasiswa
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Halaman event favorit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /student/favorites/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Student]
      summary: Memeriksa status favorit event
      responses:
        '200':
          description: Status favorit
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Student]
      summary: Menambahkan event ke favorit
      responses:
        '200':
          description: Event disimpan sebagai favorit
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean, enum: [true] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Student]
      summary: Menghapus event dari favorit
      responses:
        '200':
          description: Event dihapus dari favorit
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean, enum: [false] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /student/reviews/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Student]
      summary: Mendapatkan ulasan milik mahasiswa untuk event selesai
      responses:
        '200':
          description: Ulasan event (null bila belum diulas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Student]
      summary: Menulis atau memperbarui ulasan event selesai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, comment]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Ulasan tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /assets/posters:
    post:
      tags: [Assets]
      summary: Mengunggah poster (penyelenggara terverifikasi)
      description: |
        Kirim gambar dalam Base64 tanpa data URI prefix. Format JPG, PNG, atau WebP,
        ukuran file maksimum 2 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                data: { type: string, format: byte, description: Konten gambar Base64 }
      responses:
        '201':
          description: Poster berhasil diunggah
          content:
            application/json:
              schema:
                type: object
                properties:
                  posterUrl: { type: string, example: /api/v1/assets/posters/00000000-0000-4000-8000-000000000000 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /assets/posters/{posterId}:
    get:
      tags: [Assets]
      summary: Mengambil gambar poster
      security: []
      parameters:
        - name: posterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: File gambar; Content-Type sesuai tipe poster
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users:
    get:
      tags: [Admin]
      summary: Mendaftar akun pengguna (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PageOfObjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userId}:
    patch:
      tags: [Admin]
      summary: Mengaktifkan atau menonaktifkan akun (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200':
          description: Status akun diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  status: { type: string, enum: [active, disabled] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /admin/statistics:
    get:
      tags: [Admin]
      summary: Statistik seluruh platform (admin)
      responses:
        '200':
          description: Statistik platform
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  events: { type: integer }
                  registrations: { type: integer }
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CountLabel' }
                  months:
                    type: array
                    items: { $ref: '#/components/schemas/CountLabel' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/organizations:
    get:
      tags: [Admin]
      summary: Mendaftar organisasi (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PageOfObjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Membuat organisasi dengan status pending (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 150 }
      responses:
        '201':
          description: Organisasi dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /admin/organizations/{organizationId}:
    patch:
      tags: [Admin]
      summary: Memverifikasi atau menangguhkan organisasi (admin)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, suspended] }
      responses:
        '200':
          description: Organisasi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /admin/categories:
    get:
      tags: [Admin]
      summary: Mendaftar kategori termasuk yang nonaktif (admin)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/PageOfObjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Membuat kategori aktif (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /admin/categories/{categoryId}:
    patch:
      tags: [Admin]
      summary: Mengubah nama atau status kategori (admin)
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, isActive]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                isActive: { type: boolean }
      responses:
        '200':
          description: Kategori diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /admin/events/moderation:
    get:
      tags: [Admin]
      summary: Mendapatkan antrean, event terbit, atau riwayat moderasi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: scope
          in: query
          schema: { type: string, enum: [published, history] }
          description: Default menampilkan antrean menunggu moderasi.
      responses:
        '200':
          $ref: '#/components/responses/PageOfObjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/events/moderation/{eventId}:
    patch:
      tags: [Admin]
      summary: Menyetujui, menolak, atau membatalkan event (admin)
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [disetujui, ditolak, dibatalkan] }
                reason: { type: string, maxLength: 500, description: Wajib untuk ditolak atau dibatalkan }
      responses:
        '200':
          description: Keputusan moderasi tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId: { type: string, format: uuid }
                  status: { type: string, enum: [disetujui, ditolak, dibatalkan] }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Nomor halaman, minimal 1
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Maksimal 20 item per halaman
      schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Message:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    Unauthorized:
      description: Token hilang, tidak valid, kedaluwarsa, atau sesi dicabut
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Peran atau akses akun tidak memenuhi syarat
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Konflik status, data duplikat, atau kuota penuh
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidInput:
      description: Request tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Terlalu banyak permintaan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Payload melebihi batas ukuran
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PageOfObjects:
      description: Halaman data dengan bentuk item sesuai endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Page'
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
    Page:
      type: object
      required: [data, total, page]
      properties:
        data:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [mahasiswa, penyelenggara] }
        organizationId: { type: string, format: uuid, description: Wajib untuk role penyelenggara }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
    User:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [mahasiswa, penyelenggara, admin] }
        status: { type: string, enum: [active, pending, disabled] }
        photoUrl: { type: string }
        emailEnabled: { type: boolean }
        ukwmsVerified: { type: boolean }
        organizationId: { type: string, format: uuid }
        organizationStatus: { type: string, enum: [pending, verified, suspended] }
        organization: { $ref: '#/components/schemas/Organization' }
    Category:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        name: { type: string }
        isActive: { type: boolean }
    Organization:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [pending, verified, suspended] }
    EventInput:
      allOf:
        - $ref: '#/components/schemas/EventInputBase'
        - oneOf:
            - $ref: '#/components/schemas/InternalRegistrationInput'
            - $ref: '#/components/schemas/ExternalRegistrationInput'
    EventInputBase:
      type: object
      required: [title, description, categoryId, startAt, endAt, locationOrLink, posterUrl, registrationMode]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        locationOrLink: { type: string, minLength: 1, maxLength: 500 }
        posterUrl: { type: string, description: 'URL HTTPS atau path poster /api/v1/assets/posters/{uuid}' }
        registrationMode: { type: string, enum: [internal, external] }
        audience: { type: string }
        registrationUrl: { type: string, format: uri, description: URL HTTPS untuk pendaftaran eksternal }
        quota: { type: integer, minimum: 1, maximum: 100000, nullable: true }
    InternalRegistrationInput:
      type: object
      required: [registrationMode, quota]
      properties:
        registrationMode: { type: string, enum: [internal] }
        quota: { type: integer, minimum: 1, maximum: 100000 }
    ExternalRegistrationInput:
      type: object
      required: [registrationMode, audience, registrationUrl]
      properties:
        registrationMode: { type: string, enum: [external] }
        audience: { type: string, minLength: 1 }
        registrationUrl: { type: string, format: uri, description: URL HTTPS }
    Event:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        organizationId: { type: string, format: uuid }
        organizationName: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        locationOrLink: { type: string }
        posterUrl: { type: string }
        registrationMode: { type: string, enum: [internal, external] }
        audience: { type: string }
        registrationUrl: { type: string }
        quota: { type: integer, nullable: true }
        reservedSeats: { type: integer }
        availableSeats: { type: integer, nullable: true }
        status: { type: string, enum: [draft, menunggu_moderasi, disetujui, ditolak, selesai, dibatalkan] }
    InternalEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            version: { type: integer }
            submittedAt: { type: string, format: date-time, nullable: true }
            rejectionReason: { type: string }
    EventPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Event' }
    OrganizerEventChange:
      type: object
      required: [action, expectedStatus, expectedVersion]
      properties:
        action: { type: string, enum: [update, cancel] }
        expectedStatus: { type: string, enum: [draft, menunggu_moderasi, disetujui, ditolak] }
        expectedVersion: { type: integer, minimum: 0 }
        event: { $ref: '#/components/schemas/EventInput', description: Wajib ketika action=update }
    RegistrationCreated:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        status: { type: string, enum: [aktif] }
    Registration:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        status: { type: string, enum: [aktif, dibatalkan] }
        event:
          type: object
          properties:
            eventId: { type: string, format: uuid }
            title: { type: string }
            startAt: { type: string, format: date-time }
            endAt: { type: string, format: date-time }
            locationOrLink: { type: string }
            status: { type: string }
    RegistrationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/Registration' }
    Participant:
      type: object
      properties:
        registrationId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        registeredAt: { type: string, format: date-time }
    ParticipantPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            eventTitle: { type: string }
            data:
              type: array
              items: { $ref: '#/components/schemas/Participant' }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  notificationId: { type: string, format: uuid }
                  eventId: { type: string, format: uuid }
                  title: { type: string }
                  status: { type: string }
                  reason: { type: string }
                  createdAt: { type: string, format: date-time }
                  isRead: { type: boolean }
    ReviewResult:
      type: object
      properties:
        title: { type: string }
        review:
          type: object
          nullable: true
          properties:
            rating: { type: integer, minimum: 1, maximum: 5 }
            comment: { type: string }
    CountLabel:
      type: object
      properties:
        label: { type: string }
        total: { type: integer, minimum: 0 }
security:
  - bearerAuth: []
